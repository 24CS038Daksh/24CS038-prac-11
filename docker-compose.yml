version: '3.8'

# ==============================================================================
# Practical 11: Full-Stack Docker Containerization & Docker Compose Orchestration
# Student: Daksh Karangiya | Roll: 24CS038 | Course: ITUE301
# Architecture: Frontend (React:5173) -> Backend (Node:5000) -> Database (MongoDB:27017)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=task_manager_p11
    volumes:
      # Named volume for persistent database storage across container restarts
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Node.js / Express Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task_manager_p11
      - NODE_ENV=production
      - STUDENT_ID=24CS038
      - STUDENT_NAME=Daksh Karangiya
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Multi-Stage Build)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

# ------------------------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    name: task-manager-mongo-data
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network for Inter-Container Communication
# ------------------------------------------------------------------------------
networks:
  app-network:
    name: task-manager-app-network
    driver: bridge
